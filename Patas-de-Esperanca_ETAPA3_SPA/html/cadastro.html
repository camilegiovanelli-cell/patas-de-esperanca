<section class="conteudo">
  <div class="intro-cadastro">
    <div>
      <h1>Faça a diferença!</h1>
      <p>Preencha seus dados e venha fazer parte dessa causa. Juntos, podemos construir um futuro melhor para os gatos da nossa comunidade.</p>
    </div>
    <img src="imagens/sobre.png" alt="Gato sendo cuidado, representando a proteção aos animais">
  </div>

  <div id="cadastroSalvo" class="alert alert-info" role="status" hidden></div>

  <form id="cadastroForm">
    <fieldset>
      <legend>Dados pessoais</legend>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="nascimento">Data de nascimento:</label>
      <input type="date" id="nascimento" name="nascimento" required>

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" required maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" inputmode="numeric" title="Digite o CPF no formato 000.000.000-00">

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" required maxlength="15" pattern="\(\d{2}\) \d{5}-\d{4}" placeholder="(11) 99999-9999" inputmode="tel" title="Digite o telefone no formato (11) 99999-9999">
    </fieldset>

    <fieldset>
      <legend>Endereço</legend>

      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" required maxlength="9" pattern="\d{5}-\d{3}" placeholder="00000-000" inputmode="numeric" title="Digite o CEP no formato 00000-000">

      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" required>

      <label for="numero">Número:</label>
      <input type="number" id="numero" name="numero" required min="1">

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">

      <label for="estado">Estado:</label>
      <select id="estado" name="estado" required>
        <option value="">Selecione</option>
        <option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option>
        <option value="PR">PR</option><option value="SC">SC</option><option value="RS">RS</option>
        <option value="BA">BA</option><option value="PE">PE</option><option value="GO">GO</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Como deseja participar?</legend>

      <label for="participacao">Forma de contribuição:</label>
      <select id="participacao" name="participacao" required>
        <option value="">Selecione</option>
        <option value="voluntario">Trabalho voluntário</option>
        <option value="doacao">Doação financeira</option>
        <option value="lar">Lar temporário</option>
      </select>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" maxlength="500" placeholder="Conte como gostaria de ajudar."></textarea>
    </fieldset>

    <button type="submit">Enviar cadastro</button>
  </form>

  <div class="toast sucesso" id="toastSucesso" role="status" aria-live="polite" hidden>Cadastro salvo neste navegador com sucesso!</div>
</section>
